[workspace]
members = ["wrapper", "launcher", "env-file", "process"]
# The desktop shell needs native WebView
# libraries and has dedicated Windows/Linux/macOS CI jobs and its own lockfile.
exclude = ["launcher-app/src-tauri"]
resolver = "2"

[workspace.package]
version = "1.21.0-alpha.0"
edition = "2021"
