[workspace]
members = ["wrapper", "launcher", "env-file"]
# rust-poc is a standalone experiment; src-tauri needs WebView system libs
# and is built on Windows in Phase 4.
exclude = ["rust-poc", "launcher-app/src-tauri"]
resolver = "2"

[workspace.package]
version = "1.20.0"
edition = "2021"
license = "MIT"
