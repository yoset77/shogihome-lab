[workspace]
members = ["wrapper", "launcher", "env-file"]
# rust-poc is a standalone experiment. The desktop shell needs native WebView
# libraries and has dedicated Windows/Linux/macOS CI jobs and its own lockfile.
exclude = ["rust-poc", "launcher-app/src-tauri"]
resolver = "2"

[workspace.package]
version = "1.20.0"
edition = "2021"
license = "MIT"
