[package]
name = "shogihome-engine-wrapper"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TCP relay between ShogiHome server and USI engines (Rust rewrite of engine_wrapper.py / engine-wrapper.mjs)"

[[bin]]
name = "shogihome-wrapper"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
encoding_rs = "0.8"
hmac = "0.12"
sha2 = "0.10"
subtle = "1"
rand = "0.8"
serde_json = { version = "1", features = ["preserve_order"] }
shogihome-env-file = { path = "../env-file" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "10", default-features = false, features = ["tokio1", "creation-flags", "job-object", "kill-on-drop"] }
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
