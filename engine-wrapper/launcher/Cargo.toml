[package]
name = "shogihome-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform launcher backend: supervision, editor sessions, settings, migration and updates"

[lib]
name = "shogihome_launcher"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rand = "0.8"
encoding_rs = "0.8"
thiserror = "2"
ureq = { version = "3", default-features = true }
shogihome-env-file = { path = "../env-file" }
shogihome-process = { path = "../process" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
