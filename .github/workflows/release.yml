name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Version gate (single version authority)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python engine-wrapper/scripts/check_versions.py --tag $env:RELEASE_TAG

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: shogihome/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # --- Frontend & Server Build (unchanged layout) ---
      - name: Install Node dependencies
        working-directory: shogihome
        run: npm ci

      - name: Build Webapp and Server Runtime
        working-directory: shogihome
        # npm run build now includes license generation and copying to webapp
        run: |
          npm run build
          npm run server:runtime

      # --- Rust Wrapper & Launcher Build ---
      - name: Build wrapper (release)
        working-directory: engine-wrapper
        run: cargo build --release --locked -p shogihome-engine-wrapper

      - name: Install launcher UI dependencies
        working-directory: engine-wrapper/launcher-app
        run: npm ci

      - name: Verify Tauri shell lockfile
        working-directory: engine-wrapper/launcher-app/src-tauri
        # src-tauri is excluded from the workspace with its own lockfile:
        # fail here instead of silently resolving new Tauri dependencies.
        run: cargo fetch --locked

      - name: Build launcher (Tauri, no bundle)
        working-directory: engine-wrapper/launcher-app
        # Portable ZIP distribution: the exe is assembled into the ZIP below.
        # `tauri build` (with bundling) is only for local installer experiments.
        # The lockfile check above guarantees locked dependency resolution.
        run: npx tauri build --no-bundle

      # --- Licenses (replaces the old embedded-Python license step) ---
      - name: Install cargo-about (pinned)
        run: cargo install cargo-about --version 0.9.2 --locked --features=cli

      - name: Generate Rust third-party notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "pkg-licenses" -Force
          python engine-wrapper/scripts/generate_rust_licenses.py --manifest-dir engine-wrapper --config engine-wrapper/about.toml --section "Rust workspace (wrapper + launcher)" --append "pkg-licenses/RUST-THIRD-PARTY-NOTICES.txt"
          python engine-wrapper/scripts/generate_rust_licenses.py --manifest-dir engine-wrapper/launcher-app/src-tauri --config engine-wrapper/about.toml --section "Tauri shell" --append "pkg-licenses/RUST-THIRD-PARTY-NOTICES.txt"

      - name: Generate launcher UI third-party notices
        working-directory: engine-wrapper/launcher-app
        # Pinned to the same license-checker major used by shogihome.
        run: npx --yes license-checker@25.0.1 --production --json > ../../pkg-licenses/UI-THIRD-PARTY.json

      - name: Write Version File
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          Set-Content -Path "engine-wrapper/VERSION" -Value $version -NoNewline

      # --- Packaging ---
      - name: Create Release Package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tagName = $env:RELEASE_TAG
          if ($tagName -notmatch '^v[0-9A-Za-z._-]+$') {
              throw "Invalid release tag: $tagName"
          }
          $pkgName = "shogihome-lab-$tagName"
          New-Item -ItemType Directory -Path $pkgName -Force

          # 0. Launcher & Wrapper exes + Root
          Copy-Item "engine-wrapper/launcher-app/src-tauri/target/release/ShogiHomeLab.exe" -Destination "$pkgName/"
          Copy-Item "engine-wrapper/target/release/shogihome-wrapper.exe" -Destination "$pkgName/wrapper.exe"
          Copy-Item "shogihome/build/icon.png" -Destination "$pkgName/icon.png"
          Copy-Item "assets/release/README.txt" -Destination "$pkgName/"

          # 1. Server & Webapp (unchanged)
          New-Item -ItemType Directory -Path "$pkgName/shogihome" -Force
          Copy-Item -Path "shogihome/dist/bin/*" -Destination "$pkgName/shogihome/" -Recurse
          Copy-Item -Path "shogihome/docs/webapp" -Destination "$pkgName/shogihome/docs/webapp" -Recurse
          Copy-Item "shogihome/.env.example" -Destination "$pkgName/shogihome/.env"

          # 2. Engine Wrapper config seeds, VERSION, licenses
          New-Item -ItemType Directory -Path "$pkgName/engine-wrapper" -Force
          Copy-Item "engine-wrapper/engines.json.default" -Destination "$pkgName/engine-wrapper/engines.json"
          Copy-Item "engine-wrapper/.env.example" -Destination "$pkgName/engine-wrapper/.env"
          Copy-Item "engine-wrapper/VERSION" -Destination "$pkgName/engine-wrapper/"
          New-Item -ItemType Directory -Path "$pkgName/engine-wrapper/licenses" -Force
          Copy-Item "pkg-licenses/*" -Destination "$pkgName/engine-wrapper/licenses/"

          # 3. Artifact validation WITHOUT repo files (phase-0-baseline.md section 4):
          #    boot the assembled tree from an unrelated CWD and speak the
          #    wrapper TCP contract against it.
          $required = @(
              "ShogiHomeLab.exe", "wrapper.exe", "icon.png", "README.txt",
              "shogihome/shogihome-server.exe", "shogihome/dist/server/server.js",
              "shogihome/docs/webapp", "shogihome/.env",
              "engine-wrapper/engines.json", "engine-wrapper/.env", "engine-wrapper/VERSION",
              "engine-wrapper/licenses/RUST-THIRD-PARTY-NOTICES.txt",
              "engine-wrapper/licenses/UI-THIRD-PARTY.json"
          )
          foreach ($rel in $required) {
              if (-not (Test-Path "$pkgName/$rel")) { throw "Package missing: $rel" }
          }
          if ((Get-Item "$pkgName/engine-wrapper/licenses/RUST-THIRD-PARTY-NOTICES.txt").Length -eq 0) {
              throw "Empty Rust license notices"
          }

          $smokeDir = New-Item -ItemType Directory -Path (Join-Path $env:TEMP "wrapper-smoke") -Force
          '[]' | Set-Content (Join-Path $smokeDir "engines.json") -NoNewline
          $listener = New-Object Net.Sockets.TcpListener([Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $smokePort = $listener.LocalEndpoint.Port
          $listener.Stop()
          $wrapperExe = Join-Path (Get-Location).Path "$pkgName/wrapper.exe"
          $env:BIND_ADDRESS = "127.0.0.1"
          $env:LISTEN_PORT = "$smokePort"
          $env:WRAPPER_ACCESS_TOKEN = ""
          Push-Location $env:TEMP
          try {
              $proc = Start-Process $wrapperExe `
                  -ArgumentList "--config-dir", $smokeDir.FullName -PassThru
              try {
                  $client = New-Object Net.Sockets.TcpClient
                  $deadline = (Get-Date).AddSeconds(20)
                  while (-not $client.Connected -and (Get-Date) -lt $deadline) {
                      try { $client.Connect("127.0.0.1", $smokePort) }
                      catch { Start-Sleep -Milliseconds 200 }
                  }
                  if (-not $client.Connected) { throw "Packaged wrapper did not listen" }
                  $stream = $client.GetStream()
                  $writer = New-Object IO.StreamWriter($stream)
                  $writer.Write("list`n")
                  $writer.Flush()
                  $reader = New-Object IO.StreamReader($stream)
                  $body = $reader.ReadToEnd()
                  $client.Close()
                  if ((@($body | ConvertFrom-Json)).Count -ne 0) { throw "Expected empty engines array, got: $body" }
              } finally {
                  Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              }
          } finally {
              Pop-Location
          }

          # Zip it
          Compress-Archive -Path "$pkgName" -DestinationPath "$pkgName.zip"

          # 4. Engine-tools package (wrapper + GUI only, no server bundle):
          #    for split hosts where the Middle Server runs elsewhere
          #    (remote PC / Docker). Same exes, editor-only entry point.
          $toolsName = "shogihome-lab-engine-tools-$tagName"
          New-Item -ItemType Directory -Path $toolsName -Force
          Copy-Item "engine-wrapper/launcher-app/src-tauri/target/release/ShogiHomeLab.exe" -Destination "$toolsName/"
          Copy-Item "engine-wrapper/target/release/shogihome-wrapper.exe" -Destination "$toolsName/wrapper.exe"
          Copy-Item "engine-wrapper/ConfigEditor.cmd" -Destination "$toolsName/"
          Copy-Item "shogihome/build/icon.png" -Destination "$toolsName/icon.png"
          Copy-Item "assets/release/README-engine-tools.txt" -Destination "$toolsName/README.txt"
          New-Item -ItemType Directory -Path "$toolsName/engine-wrapper" -Force
          Copy-Item "engine-wrapper/engines.json.default" -Destination "$toolsName/engine-wrapper/engines.json"
          Copy-Item "engine-wrapper/.env.example" -Destination "$toolsName/engine-wrapper/.env"
          Copy-Item "engine-wrapper/VERSION" -Destination "$toolsName/engine-wrapper/"
          New-Item -ItemType Directory -Path "$toolsName/engine-wrapper/licenses" -Force
          Copy-Item "pkg-licenses/*" -Destination "$toolsName/engine-wrapper/licenses/"
          $toolsRequired = @(
              "ShogiHomeLab.exe", "wrapper.exe", "ConfigEditor.cmd", "icon.png", "README.txt",
              "engine-wrapper/engines.json", "engine-wrapper/.env", "engine-wrapper/VERSION",
              "engine-wrapper/licenses/RUST-THIRD-PARTY-NOTICES.txt",
              "engine-wrapper/licenses/UI-THIRD-PARTY.json"
          )
          foreach ($rel in $toolsRequired) {
              if (-not (Test-Path "$toolsName/$rel")) { throw "Engine-tools package missing: $rel" }
          }
          if (Test-Path "$toolsName/shogihome") { throw "Engine-tools package must not contain a server bundle" }
          Compress-Archive -Path "$toolsName" -DestinationPath "$toolsName.zip"

      - name: Attest Build Provenance
        uses: actions/attest@v4
        with:
          subject-path: shogihome-lab-*.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: shogihome-lab-*.zip
          draft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
