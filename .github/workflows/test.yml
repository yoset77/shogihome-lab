name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shogihome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: shogihome/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Audit Scripts
        run: npm run audit:scripts

      - name: Lint
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Check single version authority
        working-directory: .
        run: python3 engine-wrapper/scripts/check_versions.py

  test-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine-wrapper
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "pytest==9.1.1" python-dotenv
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
      - name: Contract tests (Rust wrapper)
        run: python -m pytest tests/test_wrapper_contract.py -q
      - name: License notice formatter regression
        run: python -m pytest tests/test_generate_rust_licenses.py -q

  test-launcher-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: engine-wrapper/launcher-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run tests
        run: npx vitest run
      - name: Production build
        run: npm run build

  test-launcher-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine-wrapper
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "pytest==9.1.1" playwright python-dotenv
      - name: Build wrapper
        run: cargo build --locked -p shogihome-engine-wrapper
      - name: Windows service and probe regressions
        run: |
          cargo test --locked -p shogihome-launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p shogihome-engine-wrapper --test config_dir
      - name: Windows wrapper contract
        run: python -m pytest tests/test_wrapper_contract.py -q
      - name: Build Tauri shell and verify portable binary name
        working-directory: engine-wrapper/launcher-app
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tauri build --no-bundle -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "src-tauri/target/release/ShogiHomeLab.exe")) {
            throw "Portable launcher binary is missing"
          }
      - name: Check WebView2 runtime
        run: |
          $client = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          if (Test-Path $client) {
            Write-Host ("WebView2 Runtime: " + (Get-ItemProperty $client).pv)
          } else {
            Write-Host "WebView2 Runtime key missing; installed EdgeUpdate clients:"
            Get-ChildItem "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients" | ForEach-Object { $_.PSChildName }
          }
      - name: Windows launcher GUI regression
        run: python -m pytest tests/test_launcher_gui.py tests/test_launcher_cli.py tests/test_server_runtime.py -q --basetemp="${{ runner.temp }}/launcher-gui-win"
        env:
          SHOGIHOME_GUI_EXE: launcher-app/src-tauri/target/release/ShogiHomeLab.exe
      - name: Upload Windows GUI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: launcher-windows-gui-diagnostics
          path: |
            ${{ runner.temp }}/launcher-gui-win/**/launcher.log
            ${{ runner.temp }}/launcher-gui-win/**/gui-driver.log
            ${{ runner.temp }}/launcher-gui-win/**/editor-standalone*.log
            ${{ runner.temp }}/launcher-gui-win/**/logs/server.log
            ${{ runner.temp }}/launcher-gui-win/**/logs/wrapper.log

  test-launcher-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: engine-wrapper
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Linux WebView and GUI test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config webkit2gtk-driver xvfb xauth dbus-x11 openbox xdotool wmctrl scrot
      - name: Install test dependencies
        run: python -m pip install "pytest==9.1.1" playwright python-dotenv
      - name: Native backend tests
        run: cargo test --locked --workspace
      - name: Wrapper contract
        run: python -m pytest tests/test_wrapper_contract.py -q
      - name: Build native Tauri shell
        working-directory: engine-wrapper/launcher-app
        run: |
          npm ci
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
          npx tauri build --no-bundle -- --locked
          test -x src-tauri/target/release/ShogiHomeLab
      - name: Check shell formatting and lint
        working-directory: engine-wrapper/launcher-app
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Native CLI and runtime assembly
        run: python -m pytest tests/test_launcher_cli.py tests/test_server_runtime.py -q
        env:
          SHOGIHOME_GUI_EXE: launcher-app/src-tauri/target/release/ShogiHomeLab
      - name: Install WebDriver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.0.5 --locked
      - name: Linux native GUI regressions
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a python -m pytest tests/test_launcher_linux_gui.py -q --basetemp="${{ runner.temp }}/launcher-gui"
        env:
          SHOGIHOME_GUI_EXE: launcher-app/src-tauri/target/release/ShogiHomeLab
      - name: Upload GUI failure diagnostics
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: launcher-linux-gui-diagnostics
          path: |
            ${{ runner.temp }}/launcher-gui/**/gui.log
            ${{ runner.temp }}/launcher-gui/**/failure.png
            ${{ runner.temp }}/launcher-gui/**/engine-wrapper/logs/*.log
