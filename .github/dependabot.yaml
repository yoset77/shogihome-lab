version: 2
updates:
  # shogihome (Frontend/Server) dependencies
  - package-ecosystem: "npm"
    directory: "/shogihome"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "17:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10

  # engine-wrapper launcher UI (Tauri frontend) dependencies
  - package-ecosystem: "npm"
    directory: "/engine-wrapper/launcher-app"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "17:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    groups:
      engine-wrapper-dependencies:
        patterns:
          - "*"

  # engine-wrapper Rust workspace (wrapper + launcher crates)
  - package-ecosystem: "cargo"
    directory: "/engine-wrapper"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "17:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10

  # Tauri shell (separate workspace/lockfile excluded from the above)
  - package-ecosystem: "cargo"
    directory: "/engine-wrapper/launcher-app/src-tauri"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "17:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "17:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
